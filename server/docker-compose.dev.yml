# Local MongoDB for dev / smoke tests. Keeps prod Atlas (server/.env) untouched.
# Usage: docker compose -f docker-compose.dev.yml up -d
services:
  mongo:
    image: mongo:7
    container_name: dmdlab-mongo
    ports:
      - "27017:27017"
    volumes:
      - dmdlab-mongo-data:/data/db

volumes:
  dmdlab-mongo-data:
