name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --ignore-scripts
      # Generates .next/types so tsc --noEmit checks typed routes; no DB/secrets needed.
      # --no-install ensures this resolves the version already pinned in
      # package-lock.json (installed above) rather than letting npx fetch
      # and execute an on-demand package from the registry.
      - run: npx --no-install next typegen
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test